name: Huak nightly

on:
  push:
    branches: [main]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'build/**'
      - 'cli/**'
      - 'src/**'
      - 'stdlib/**'
      - 'apps/formatter/**'
      - 'apps/language_server/**'
      - 'libtypst/include/**'
      - 'tests/space_projection.cpp'
      - 'tests/space_contour_function.cpp'
      - 'tests/space_regions.cpp'
      - 'tests/space_loader.cpp'
      - '.github/workflows/huak-nightly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x86_64, backend: libhuak_space.so }
          - { runner: macos-15, platform: macos-arm64, backend: libhuak_space.dylib }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"
      - name: Restore Zig and OCCT build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: zig-cache
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-occt-8.0.2-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon', 'build/occt.zig') }}
          restore-keys: |
            zig-occt-8.0.2-${{ matrix.runner }}-${{ runner.arch }}-
      - name: Build and test desktop tools and the OCCT projection library
        run: |
          zig build tools space-backend test-backend test-cli-options test-space-cpp \
            -Doptimize=ReleaseSafe -Dcpu=baseline
          zig-out/bin/huak --help
      # Saved right after the build, so a later failing step does not discard it.
      - name: Save Zig and OCCT build cache
        if: steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
      - name: Package executables and the projection library
        run: |
          tar -czf huak-${{ matrix.platform }}.tar.gz -C "$PWD/zig-out/bin" huak huak-fmt huak-lsp \
            -C "$PWD/zig-out/lib" ${{ matrix.backend }} -C "$PWD/zig-out" share/licenses/huak/occt
          dest=$(mktemp -d)
          tar -xf huak-${{ matrix.platform }}.tar.gz -C "$dest"
          zig build run-space-loader -Doptimize=ReleaseSafe -Dcpu=baseline -- "$dest/${{ matrix.backend }}"
          if [[ "$RUNNER_OS" == macOS ]]; then
            DYLD_PRINT_LIBRARIES=1 "$dest/huak" --help 2>"$dest/loaded"
            grep -F "$dest/${{ matrix.backend }}" "$dest/loaded"
          else
            LD_DEBUG=libs "$dest/huak" --help 2>"$dest/loaded"
            grep -F 'calling init:' "$dest/loaded" | grep -F "$dest/${{ matrix.backend }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huak-${{ matrix.platform }}
          path: huak-${{ matrix.platform }}.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish-nightly.yml
    with:
      component: huak
