[package]
name = "huak-pdf-mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[lib]
name = "huak_pdf_mesh"
path = "encode.rs"
crate-type = ["staticlib"]

[[bin]]
name = "headers"
path = "headers.rs"
required-features = ["headers"]

[features]
headers = ["dep:cbindgen"]

[dependencies]
pdf-writer = "=0.15.0"
miniz_oxide = "=0.9.1"
cbindgen = { version = "=0.29.4", optional = true, default-features = false }
